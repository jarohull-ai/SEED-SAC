# SEED SAC Configuration Example
# Copy this file to `config/default.toml` and adjust values for your system.

[sentinel]
# Polling interval in milliseconds (50-5000 ms range)
poll_interval_ms = 250

# Resource pressure thresholds
[thresholds.ram]
# RAM pressure levels (percentage of total system RAM)
yellow_pct = 75.0   # Warning threshold: reduce foreground load
red_pct = 88.0      # Critical threshold: freeze highest-growth process

[thresholds.cpu]
# CPU pressure levels (percentage)
yellow_pct = 70.0   # Warning: monitor CPU usage

[thresholds.vram]
# VRAM pressure levels (percentage of GPU memory)
yellow_pct = 80.0   # Warning threshold
red_pct = 92.0      # Critical threshold: freeze GPU-consuming process

# Guard / mitigation settings
[guard]
# Memory growth threshold in MB/sec to trigger Red state
ram_spike_mb_per_sec = 500.0

# Processes that should never be frozen or terminated
[guard.immune_processes]
names = [
    "systemd", "pipewire", "dbus-daemon",
    "Xorg", "Xwayland", "kwin", "mutter",
    "gnome-shell", "sway", "hyprland",
    "sac"  # The SAC process itself
]

# L1 (Large Model) integration
[l1_provider]
# Enable/disable LLM integration
enabled = true

# Backend type: "openai_compatible" (LM Studio, Ollama, etc.)
backend = "openai_compatible"

# Local LLM server endpoint (LM Studio default: http://127.0.0.1:1234/v1)
base_url = "http://127.0.0.1:1234/v1"

# Model name to use (must be loaded in LM Studio or compatible server)
model = "Ling-3.0-tiny"

# Request timeout in milliseconds
timeout_ms = 5000

# Maximum tokens in response
max_tokens = 512

# Temperature (0.0 = deterministic, 1.0 = creative)
temperature = 0.2
