[package]
name = "sentinel"
version.workspace = true
edition.workspace = true

[features]
default = []
nvidia = ["nvml-wrapper"]

[dependencies]
sysinfo = "0.34"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
arc-swap = "1"
tracing = "0.1"

[dependencies.nvml-wrapper]
version = "0.10"
optional = true
